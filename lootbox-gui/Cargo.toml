[package]
name = "lootbox-gui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "lootbox-gui"
path = "src/main.rs"

[dependencies]
lootbox = { path = "../lootbox-core" }
gpui = "0.2.2"
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"
anyhow = "1.0"

[dev-dependencies]
tempfile = "3.10"
gpui = { version = "0.2.2", features = ["test-support"] }
