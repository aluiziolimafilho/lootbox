[package]
name = "lootbox"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.10"
argon2 = "0.5"
clap = { version = "4.5", features = ["derive"] }
rpassword = "7.3"
serde = { version = "1.0", features = ["derive"] }
